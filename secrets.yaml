# ==========================================================================
# CRE SECRETS SETTINGS FILE — PrivateSignal
# ==========================================================================
# The confidential model parameters are stored as DON secrets, never compiled
# into the workflow. `secretsNames` maps each secret id the workflow code reads
# (MODEL_WEIGHTS, POLICY_THRESHOLDS, POLICY_PROFILES) to the environment
# variable(s) that supply its value:
#   - local simulation: the env var is read from .env / environment
#   - deployed workflow: the value lives in the Vault DON (cre secrets create)
# The env var names carry a _VAR suffix to avoid the CRE CLI prefix/substring
# secret-resolution bug.
secretsNames:
  MODEL_WEIGHTS:
    - "MODEL_WEIGHTS_VAR"
  POLICY_THRESHOLDS:
    - "POLICY_THRESHOLDS_VAR"
  POLICY_PROFILES:
    - "POLICY_PROFILES_VAR"
